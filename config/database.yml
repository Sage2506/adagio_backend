default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: adagio_backend_development

test:
  <<: *default
  database: adagio_backend_test
production:
  primary: &primary_production
    <<: *default
    database: adagio_backend_production
    username: barry
  cache:
    <<: *primary_production
    database: adagio_backend_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: adagio_backend_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: adagio_backend_production_cable
    migrations_paths: db/cable_migrate
